<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Notebook</title>
<style>:root{--accent:#3b5bdb}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f7f7f5;color:#1d1d1b}
main{padding:20px}.card{display:inline-block;margin:8px;padding:16px;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
h1{color:var(--accent)}</style></head>
<body><main data-dc-id="main"><h1 data-dc-id="title">Notebook</h1><p data-dc-id="lede">A sample phone screen for tests.</p>
<section data-dc-id="grid"><div class="card" data-dc-id="card-1"><b>First item</b><div>Subtitle</div></div><div class="card" data-dc-id="card-2"><b>Second item</b><div>Subtitle</div></div></section>
<button data-dc-id="cta" onclick="this.textContent='Clicked'">Continue</button></main></body></html>
